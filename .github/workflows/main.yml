name: Kernel Builder

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl build-essential bc \
          flex bison libssl-dev ccache libncurses-dev \
          libelf-dev python3 python3-pip zip unzip

    - name: Clone Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup Environment
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_COMPILER_STRING="$($GITHUB_WORKSPACE/clang/bin/clang --version | head -n 1)"
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Build Kernel
      run: |
        make O=out ARCH=arm64 vendor/<defconfig>
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload zImage/anykernel
      uses: actions/upload-artifact@v3
      with:
        name: Kernel
        path: out/arch/arm64/boot/Image.gz-dtb
